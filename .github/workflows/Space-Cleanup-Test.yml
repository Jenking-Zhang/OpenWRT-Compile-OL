name: Space-Cleanup-Test

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      # ====== Phase 1: 诊断 runner 上有什么可以清 ======
      - name: Diagnose Runner Disk Usage
        run: |
          echo "=== 1. 初始磁盘 ==="
          df -h /

          echo ""
          echo "=== 2. 预装大型目录（逐个检查是否存在+体积）==="
          DIRS=(
            "/usr/local/lib/android"
            "/usr/share/dotnet"
            "/usr/share/swift"
            "/usr/share/miniconda"
            "/usr/share/google-chrome"
            "/opt/google/chrome"
            "/opt/microsoft"
            "/usr/share/microsoft-edge"
            "/usr/lib/firefox"
            "/usr/share/firefox"
            "/opt/hostedtoolcache"
            "/home/linuxbrew"
            "/usr/share/az"
            "/opt/az"
            "/etc/mysql"
            "/var/lib/mysql"
            "/etc/postgresql"
            "/var/lib/postgresql"
            "/usr/share/postgresql"
            "/etc/php"
            "/usr/lib/php"
            "/etc/apache2"
            "/etc/nginx"
            "/usr/share/powershell"
            "/usr/share/haskell"
            "/var/lib/docker"
            "/usr/local/share/docker"
            "/opt/hostedtoolcache/go"
            "/opt/hostedtoolcache/node"
            "/opt/hostedtoolcache/Python"
            "/opt/hostedtoolcache/CodeQL"
            "/opt/hostedtoolcache/llvm"
            "/usr/share/dotnet"
            "/usr/lib/mono"
            "/usr/share/texlive"
            "/var/cache/apt"
            "/tmp"
          )
          for d in "${DIRS[@]}"; do
            if [ -e "$d" ]; then
              sz=$(du -sh "$d" 2>/dev/null | awk '{print $1}')
              echo "  EXIST ${sz}  $d"
            else
              echo "  MISS        $d"
            fi
          done

          echo ""
          echo "=== 3. 预装 apt 包（可能可清）==="
          APT_PKGS=(
            "android-sdk" "android-sdk-platform-tools"
            "azure-cli" "azure-functions-core-tools"
            "dotnet-sdk-6.0" "dotnet-sdk-7.0" "dotnet-sdk-8.0"
            "google-cloud-cli" "google-cloud-sdk"
            "golang-go"
            "ghc" "ghc-*" "haskell-platform"
            "firefox"
            "powershell"
            "temurin-17-jdk" "temurin-21-jdk"
            "zulu-*"
            "mongodb-org" "redis-server" "mysql-server" "postgresql"
            "php-cli" "php-fpm" "libapache2-mod-php"
            "ruby-full" "ruby-dev"
            "snapd"
            "texlive-base" "texlive-latex-*" "texlive-lang-*"
            "yarn" "nodejs"
            "libclang*" "clang-*" "llvm-*" "lld-*"
            "gcc-9" "gcc-10" "gcc-11" "gcc-12" "gcc-13" "gcc-14"
            "g++-9" "g++-10" "g++-11" "g++-12" "g++-13" "g++-14"
          )
          for p in "${APT_PKGS[@]}"; do
            cnt=$(dpkg -l "$p" 2>/dev/null | grep -c '^ii')
            if [ "$cnt" -gt 0 ]; then
              total=$(apt show "$p" 2>/dev/null | grep '^Installed-Size' | awk '{print $2}' | head -1)
              echo "  INSTALLED  ${p}  Installed-Size=${total} KB"
            fi
          done

          echo ""
          echo "=== 4. apt 缓存大小 ==="
          du -sh /var/cache/apt/archives 2>/dev/null || echo "  (none)"

          echo ""
          echo "=== 5. Top 10 根目录占用 ==="
          sudo du -h --max-depth=1 / 2>/dev/null | sort -rh | head -15

      # ====== Phase 2: 执行清理，每步打印效果 ======
      - name: Cleanup & Verify
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo ""
          echo "========== 开始清理 =========="
          BEFORE_ROOT=$(df -k / | tail -1 | awk '{print $3}')
          set +e  # 清理允许失败，不要因为某个包不存在就挂

          echo ""
          echo "--- Step A: rm -rf 预装无用目录 ---"
          RM_DIRS=(
            "/usr/local/lib/android"
            "/usr/share/dotnet"
            "/usr/share/swift"
            "/usr/share/miniconda"
            "/opt/google/chrome"
            "/opt/microsoft"
            "/opt/hostedtoolcache"
            "/home/linuxbrew"
            "/opt/az"
            "/usr/share/az"
            "/etc/mysql"
            "/var/lib/mysql"
            "/var/lib/postgresql"
            "/usr/share/postgresql"
            "/usr/share/powershell"
            "/var/lib/docker"
          )
          for d in "${RM_DIRS[@]}"; do
            if [ -e "$d" ]; then
              sz=$(du -sh "$d" 2>/dev/null | awk '{print $1}')
              sudo rm -rf "$d" 2>/dev/null && echo "  已清理 ${sz}  $d" || echo "  失败: $d"
            else
              echo "  不存在  $d"
            fi
          done

          echo ""
          echo "--- Step B: docker image prune ---"
          docker image prune -a -f 2>/dev/null && echo "  docker prune done" || echo "  docker 不可用"

          echo ""
          echo "--- Step C: apt purge（每包组独立容错）---"
          sudo apt-get update -y -qq 2>/dev/null || true
          for GRP in \
            "android*" "azure*" "dotnet*" "google-cloud*" \
            "ghc*" "haskell-*" \
            "mysql-server*" "postgresql*" "php*" "ruby*" \
            "temurin-*" "zulu*" "texlive-base" "texlive-latex-*" "texlive-lang-*" \
            "clang-*" "llvm-*" "lld-*" "libclang*" \
            "gcc-9" "gcc-10" "g++-9" "g++-10" \
            "mono-*" "libmono-*" \
            "powershell" "snapd" "firefox"; do
            cnt=$(dpkg -l "$GRP" 2>/dev/null | grep -c '^ii')
            if [ "$cnt" -gt 0 ]; then
              echo "  purge $GRP ($cnt 包)..."
              sudo apt-get purge -y "$GRP" 2>/dev/null || true
            else
              echo "  不存在 $GRP"
            fi
          done
          sudo apt-get autoremove -y 2>/dev/null || true

          echo ""
          echo "--- Step D: apt autoremove + clean ---"
          sudo apt-get autoremove -y 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /var/cache/apt/* /tmp/* /var/tmp/*

          AFTER_ROOT=$(df -k / | tail -1 | awk '{print $3}')
          FREED=$(( (BEFORE_ROOT - AFTER_ROOT) / 1024 ))
          echo ""
          echo "========== 清理完成 =========="
          echo "  释放: ${FREED}MB  (约 $(( FREED / 1024 ))GB)"
          echo ""

          echo "=== 清理后磁盘 ==="
          df -h /

          echo ""
          echo "=== 清理后 Top 15 根目录占用 ==="
          sudo du -h --max-depth=1 / 2>/dev/null | sort -rh | head -15

          echo ""
          echo "=== 清理后 apt 包数 ==="
          dpkg -l | wc -l

          echo ""
          echo "=== 清理后 GCC/Clang 状态（保留的版本）==="
          for c in gcc gcc-11 gcc-12 gcc-13 gcc-14 clang clang-14 clang-15 clang-16 clang-17; do
            $c --version 2>/dev/null | head -1 || echo "  $c 不存在"
          done

          echo ""
          echo "=== OpenWrt 编译依赖安装（验证哪些缺）==="
          sudo apt-get install -y --no-install-recommends \
            gawk genisoimage device-tree-compiler libncurses5-dev libc6-dev-i386 \
            python3-pyelftools libelf-dev libdw-dev libbpf-dev \
            libgmp-dev libmpc-dev libmpfr-dev libreadline-dev libglib2.0-dev libfuse-dev \
            libtool haveged msmtp p7zip-full subversion \
            texinfo dos2unix patchelf fakeroot 2>&1 | tail -5

          echo ""
          echo "=== 最终磁盘 ==="
          df -h /
