name: Build-Package

permissions:
  contents: write
  actions: write   # 删除旧缓存条目 (DELETE /actions/caches/{id})

on:
  workflow_dispatch:
    inputs:
      config_files:
        description: '配置文件下拉（myconfig/）'
        required: true
        type: choice
        default: 'x86_64_generic_VIKINGYFY_owrt.config'
        options:
          - 'qualcommax_ipq807x_linksys-homewrk_VIKINGYFY_owrt.config'
          - 'qualcommbe_ipq53xx_jdcloud-re-cs-06_coolsnowwolf_master.config'
          - 'qualcommbe_ipq53xx_jdcloud-re-cs-06_VIKINGYFY_owrt.config'
          - 'x86_64_generic_coolsnowwolf_master.config'
          - 'x86_64_generic_VIKINGYFY_owrt.config'

      filename_override:
        description: '自定义配置文件名（优先级高于下拉）'
        required: false
        default: ''

      packages:
        description: '要编译的包，逗号分隔（如 luci-app-openclash,dockerd,luci-app-tailscale）'
        required: true
        default: ''

      enable_ccache:
        description: '启用 tools/toolchain 缓存'
        required: true
        default: 'true'
        type: choice
        options: [true, false]

      do_release:
        description: '编译后创建 Release'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

jobs:
  build_package:
    runs-on: ubuntu-22.04

    env:
      CONFIG_FILE: ${{ github.event.inputs.filename_override || github.event.inputs.config_files }}

    steps:
      - name: Init Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang cmake curl git wget sed grep jq ccache \
            device-tree-compiler gawk genisoimage libncurses5-dev \
            libc6-dev-i386 libncursesw5-dev zlib1g-dev libssl-dev \
            python3 python3-pyelftools rsync subversion unzip xz-utils \
            libgmp-dev libmpc-dev libmpfr-dev libelf-dev libdw-dev \
            libreadline-dev libtool haveged patchelf fakeroot file
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve Source From Filename
        id: resolve
        run: |
          STEM="${CONFIG_FILE%.config}"

          REPO_NAMES="VIKINGYFY JuliusBairaktaris coolsnowwolf immortalwrt openwrt LiBwrt"

          BRANCH="${STEM##*_}"

          MATCHED_REPO=""
          for repo in $REPO_NAMES; do
            if [[ "$STEM" == *"_${repo}_${BRANCH}" ]]; then
              MATCHED_REPO="$repo"
              break
            fi
          done

          [ -z "$MATCHED_REPO" ] && {
            echo "ERROR: cannot parse SHORT_REPO / BRANCH from '${CONFIG_FILE}'"
            echo "  Required format: TARGET_SUBTARGET[_TAG]_SHORT_REPO_BRANCH.config"
            echo "  Example: qualcommbe_ipq53xx_JDC-BE6500_VIKINGYFY_owrt.config"
            echo "  Known repos: $REPO_NAMES"
            exit 1
          }

          [ -z "$BRANCH" ] && {
            echo "ERROR: empty BRANCH in '${CONFIG_FILE}'"
            exit 1
          }

          case "$MATCHED_REPO" in
            "VIKINGYFY")         SOURCE_OWNER="VIKINGYFY/immortalwrt" ;;
            "coolsnowwolf")      SOURCE_OWNER="coolsnowwolf/lede" ;;
            "immortalwrt")       SOURCE_OWNER="immortalwrt/immortalwrt" ;;
            "openwrt")           SOURCE_OWNER="openwrt/openwrt" ;;
            "LiBwrt")            SOURCE_OWNER="LiBwrt/LibWrt" ;;
            "JuliusBairaktaris") SOURCE_OWNER="JuliusBairaktaris/openwrt-ppe-nss" ;;
            *)                   SOURCE_OWNER="${MATCHED_REPO}/openwrt" ;;
          esac

          echo "REPO_URL=https://github.com/${SOURCE_OWNER}" >> "$GITHUB_ENV"
          echo "REPO_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "SOURCE_OWNER=${SOURCE_OWNER}" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "SHORT_REPO=${MATCHED_REPO}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "  Resolved from filename: ${CONFIG_FILE}"
          echo "  Repo   : ${SOURCE_OWNER}"
          echo "  Branch : ${BRANCH}"
          echo "=========================================="

      - name: Verify Config File
        run: |
          if [ ! -f "myconfig/${CONFIG_FILE}" ]; then
            echo "::error::Config file myconfig/${CONFIG_FILE} not found!"
            ls myconfig/
            exit 1
          fi
          echo "Config OK: myconfig/${CONFIG_FILE}"

      - name: Clone OpenWrt Source
        id: clone
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_BRANCH}" \
              "${REPO_URL}" openwrt

          cd openwrt
          echo "WRT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Source: ${REPO_URL} (${REPO_BRANCH})"
          echo "Hash: $(git rev-parse --short HEAD)"

      - name: Feeds Update & Install
        working-directory: ./openwrt
        run: |
          sed -i 's/^#src-git helloworld/src-git helloworld/g' ./feeds.conf.default

          if ! grep -q "linkease/istore" ./feeds.conf.default 2>/dev/null; then
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import Config & Update
        working-directory: ./openwrt
        run: |
          cp -f "../myconfig/${CONFIG_FILE}" .config
          make defconfig

      - name: Resolve Cache Keys
        id: cache-keys
        continue-on-error: true
        working-directory: ./openwrt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)

          TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K[^=_]+(?==y)' .config 2>/dev/null || echo "x86")
          SUBTARGET=$(grep -m1 -oP "^CONFIG_TARGET_${TARGET}_\K[^=_]+(?==y)" .config 2>/dev/null || echo "64")
          TOOLS_HASH=$(git archive HEAD tools 2>/dev/null | sha256sum | cut -c1-7 || echo "unknown")
          TC_HASH=$(git archive HEAD tools toolchain 2>/dev/null | sha256sum | cut -c1-7 || echo "unknown")

          TOOLS_PREFIX="wrt-tools-${TOOLS_HASH}"
          TC_PREFIX="wrt-toolchain-${TARGET}-${SUBTARGET}-${TC_HASH}"
          TOOLS_SAVE_KEY="${TOOLS_PREFIX}-${TS}"
          TC_SAVE_KEY="${TC_PREFIX}-${TS}"

          api() {
            curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=$1&per_page=100"
          }
          latest() {
            echo "$1" | jq -r --arg p "$2" '[.actions_caches[] | select(.key | startswith($p))] | sort_by(.created_at) | reverse | .[0].key // empty'
          }
          inventory() {
            echo "--- $1 ---"
            echo "$2" | jq -r '.actions_caches | sort_by(.created_at) | .[] | "  \(.key)  \(.size_in_bytes/1048576|floor)MB  created=\(.created_at)"'
          }

          DJ=$(api "wrt-dl")
          TJ=$(api "wrt-tools-")
          CJ=$(api "wrt-toolchain-")
          inventory "DL 现有版本" "$DJ"
          inventory "Tools 现有版本" "$TJ"
          inventory "Toolchain 现有版本" "$CJ"

          DL_RESTORE_KEY=$(latest "$DJ" "wrt-dl");    [ -z "$DL_RESTORE_KEY" ] && DL_RESTORE_KEY="wrt-dl"
          TOOLS_RESTORE_KEY=$(latest "$TJ" "${TOOLS_PREFIX}-"); [ -z "$TOOLS_RESTORE_KEY" ] && TOOLS_RESTORE_KEY="${TOOLS_PREFIX}"
          TC_RESTORE_KEY=$(latest "$CJ" "${TC_PREFIX}-");       [ -z "$TC_RESTORE_KEY" ] && TC_RESTORE_KEY="${TC_PREFIX}"

          echo "=== 本次使用的 key（DL 只恢复不保存） ==="
          echo "  DL        restore=${DL_RESTORE_KEY}"
          echo "  Tools     restore=${TOOLS_RESTORE_KEY}  save=${TOOLS_SAVE_KEY}"
          echo "  Toolchain restore=${TC_RESTORE_KEY}  save=${TC_SAVE_KEY}"

          for kv in \
            "dl_restore_key=${DL_RESTORE_KEY}" \
            "tools_prefix=${TOOLS_PREFIX}" \
            "tc_prefix=${TC_PREFIX}" \
            "tools_restore_key=${TOOLS_RESTORE_KEY}" \
            "tc_restore_key=${TC_RESTORE_KEY}" \
            "tools_save_key=${TOOLS_SAVE_KEY}" \
            "tc_save_key=${TC_SAVE_KEY}"; do
            echo "$kv" >> "$GITHUB_OUTPUT"
          done

      - name: Restore DL Cache
        continue-on-error: true
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.dl_restore_key }}
          path: openwrt/dl

      - name: Restore Tools Cache
        id: tools-restore
        continue-on-error: true
        if: github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.tools_restore_key }}
          path: openwrt/staging_dir/host*

      - name: Restore Toolchain Cache
        id: tc-restore
        continue-on-error: true
        if: github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.tc_restore_key }}
          path: |
            openwrt/.ccache
            openwrt/staging_dir/tool*

      - name: Touch Cache Stamps
        if: success() && github.event.inputs.enable_ccache != 'false'
        working-directory: ./openwrt
        run: |
          # 缓存里的 stamp 是旧时间戳，git clone 的源码 mtime 是刚刚，不 touch 会被判定需要重编
          echo "Touching restored stamps..."
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          touch staging_dir/host/stamp/.tools_compile staging_dir/host/stamp/.tools_install 2>/dev/null || true
          for d in staging_dir/toolchain-*/stamp; do
            [ -d "$d" ] && touch "$d"/.toolchain_compile "$d"/.toolchain_install 2>/dev/null || true
          done

      - name: Build Tools
        if: success() && steps.tools-restore.outputs.cache-hit != 'true'
        working-directory: ./openwrt
        run: |
          echo "Tools cache hit='${{ steps.tools-restore.outputs.cache-hit }}' (empty = 缓存关闭或未命中) -> 编译 tools"
          mkdir -p tmp && echo "1" > tmp/.build
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          make tools/compile -j$(nproc) || make -C tools compile -j$(nproc)
          make tools/install || make -C tools install
          du -sh staging_dir/host* 2>/dev/null || true

      - name: Save Tools Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/save@main
        with:
          key: ${{ steps.cache-keys.outputs.tools_save_key }}
          path: openwrt/staging_dir/host*

      - name: Prune Tools Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%s)
          P="${{ steps.cache-keys.outputs.tools_prefix }}"
          echo "--- ${P}: 同前缀保留最新一版，其他前缀超过 30 天的删除 ---"
          JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-tools-&per_page=100")
          echo "$JSON" | jq -r --arg p "${P}-" --argjson cutoff "$CUTOFF" '
            .actions_caches as $all
            | ($all | map(select(.key | startswith($p))) | sort_by(.created_at) | reverse) as $same
            | ($same[0].key // "") as $keep
            | $all[]
            | select(
                ((.key | startswith($p)) and (.key != $keep))
                or
                ((.key | startswith($p) | not) and ((.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff))
              )
            | "\(.id)\t\(.key)\t\(.created_at)"' \
            | while IFS=$'\t' read -r ID KEY CREATED; do
                [ -z "$ID" ] && continue
                echo "  DEL ${KEY} (${CREATED})"
                CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}")
                [ "$CODE" = "204" ] || echo "  WARN: delete ${KEY} failed (HTTP ${CODE})"
              done
          echo "Tools prune done"

      - name: Build Toolchain
        if: success() && steps.tc-restore.outputs.cache-hit != 'true'
        working-directory: ./openwrt
        run: |
          echo "Toolchain cache hit='${{ steps.tc-restore.outputs.cache-hit }}' (empty = 缓存关闭或未命中) -> 编译 toolchain"
          mkdir -p tmp && echo "1" > tmp/.build
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          make toolchain/compile -j$(nproc) || make -C toolchain compile -j$(nproc)
          make toolchain/install || make -C toolchain install
          du -sh staging_dir/tool* 2>/dev/null || true

      - name: Save Toolchain Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/save@main
        with:
          key: ${{ steps.cache-keys.outputs.tc_save_key }}
          path: |
            openwrt/.ccache
            openwrt/staging_dir/tool*

      - name: Prune Toolchain Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%s)
          P="${{ steps.cache-keys.outputs.tc_prefix }}"
          echo "--- ${P}: 同前缀保留最新一版，其他前缀超过 30 天的删除 ---"
          JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-toolchain-&per_page=100")
          echo "$JSON" | jq -r --arg p "${P}-" --argjson cutoff "$CUTOFF" '
            .actions_caches as $all
            | ($all | map(select(.key | startswith($p))) | sort_by(.created_at) | reverse) as $same
            | ($same[0].key // "") as $keep
            | $all[]
            | select(
                ((.key | startswith($p)) and (.key != $keep))
                or
                ((.key | startswith($p) | not) and ((.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff))
              )
            | "\(.id)\t\(.key)\t\(.created_at)"' \
            | while IFS=$'\t' read -r ID KEY CREATED; do
                [ -z "$ID" ] && continue
                echo "  DEL ${KEY} (${CREATED})"
                CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}")
                [ "$CODE" = "204" ] || echo "  WARN: delete ${KEY} failed (HTTP ${CODE})"
              done
          echo "Toolchain prune done"

      - name: Pre-download Package Sources
        working-directory: ./openwrt
        run: |
          INPUT_PKGS="${{ github.event.inputs.packages }}"
          IFS=',' read -ra PKGS <<< "$INPUT_PKGS"

          # 包可能位于 package/feeds/<feed>/<pkg>、package/<分类>/<分类>/<pkg>（如 dropbear）或 feeds/<feed>/<pkg>
          resolve_pkg() {
            local pkg="$1" d
            d=$(find package/feeds -maxdepth 2 -type d -name "$pkg" 2>/dev/null | head -1)
            [ -z "$d" ] && d=$(find package -maxdepth 6 -type d -name "$pkg" -not -path "package/feeds/*" 2>/dev/null | head -1)
            echo "$d"
          }

          for PKG in "${PKGS[@]}"; do
            PKG="${PKG// /}"
            [ -z "$PKG" ] && continue
            TARGET=$(resolve_pkg "$PKG")
            if [ -z "$TARGET" ]; then
              echo "skip download: '$PKG' not found"
              continue
            fi
            echo "Downloading sources for $PKG ($TARGET) ..."
            make "$TARGET/download" V=s 2>&1 | tail -5 || echo "WARN: download failed for $PKG, will retry at compile"
          done
          du -sh dl/ 2>/dev/null || true

      - name: Show DL Size
        working-directory: ./openwrt
        run: du -sh dl/

      - name: Report Cache Versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Stored cache versions after update (wrt-*) ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-&per_page=100" \
            | jq -r '.actions_caches | sort_by(.key) | .[]
              | "  \(.key)  \(.size_in_bytes/1048576|floor)MB  created=\(.created_at)"'

      - name: Compile Packages
        id: compile
        working-directory: ./openwrt
        run: |
          INPUT_PKGS="${{ github.event.inputs.packages }}"
          IFS=',' read -ra PKGS <<< "$INPUT_PKGS"
          echo "Packages to compile: ${#PKGS[@]}"

          mkdir -p upload
          FAILED=()

          # 包可能位于 package/feeds/<feed>/<pkg>、package/<分类>/<分类>/<pkg>（如 dropbear）或 feeds/<feed>/<pkg>
          resolve_pkg() {
            local pkg="$1" d
            d=$(find package/feeds -maxdepth 2 -type d -name "$pkg" 2>/dev/null | head -1)
            [ -z "$d" ] && d=$(find package -maxdepth 6 -type d -name "$pkg" -not -path "package/feeds/*" 2>/dev/null | head -1)
            echo "$d"
          }

          for PKG in "${PKGS[@]}"; do
            PKG="${PKG// /}"
            [ -z "$PKG" ] && continue
            echo ""
            echo "=========================================="
            echo "  Compiling: $PKG"
            echo "=========================================="

            TARGET=$(resolve_pkg "$PKG")

            if [ -z "$TARGET" ]; then
              echo "::error::Package '$PKG' not found in package/ or feeds/"
              FAILED+=("$PKG(not found)")
              continue
            fi

            echo "Found at: $TARGET"
            if make "$TARGET/compile" V=s 2>&1; then
              echo "OK: $PKG compiled"
              # 新版 OpenWrt/immortalwrt 用 apk，旧版用 ipk，两种都收
              find bin/ -type f \( -name "${PKG}*.ipk" -o -name "${PKG}*.apk" \) -exec cp -f {} upload/ \; 2>/dev/null || true
              find bin/ -type f \( -name "*.ipk" -o -name "*.apk" \) -mmin -15 -exec cp -f {} upload/ \; 2>/dev/null || true
            else
              echo "FAILED: $PKG"
              FAILED+=("$PKG")
            fi
          done

          echo ""
          echo "=========================================="
          echo "  Results"
          echo "=========================================="
          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::Failed packages: ${FAILED[*]}"
          fi
          echo "Collected packages:"
          ls -lh upload/ 2>/dev/null | tail -n +2 || echo "  (none)"

          echo "fail_count=${#FAILED[@]}" >> "$GITHUB_OUTPUT"

          # 有失败就让整个 job 失败（artifact 步骤用 if: always() 仍然会上传已成功的包）
          [ ${#FAILED[@]} -eq 0 ] || exit 1

      - name: Upload Package Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ github.run_number }}
          path: |
            openwrt/upload/*.ipk
            openwrt/upload/*.apk
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare Release Meta
        if: github.event.inputs.do_release == 'true' && success()
        run: |
          echo "RELEASE_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"
          INPUT_PKGS="${{ github.event.inputs.packages }}"
          echo "PKG_LIST=${INPUT_PKGS}" >> "$GITHUB_ENV"

      - name: Create Release
        if: github.event.inputs.do_release == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: package/${{ github.run_number }}
          name: 'Packages: ${{ env.PKG_LIST }} | ${{ env.SOURCE_OWNER }} | Run #${{ github.run_number }}'
          files: |
            openwrt/upload/*.ipk
            openwrt/upload/*.apk
          body: |
            **Packages**: `${{ env.PKG_LIST }}`
            **Source**: `${{ env.REPO_URL }}`
            **Branch**: `${{ env.SOURCE_BRANCH }}`
            **Run**: #${{ github.run_number }}
            **Commit**: ${{ steps.clone.outputs.WRT_HASH }}
            **Date**: ${{ env.RELEASE_DATE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
