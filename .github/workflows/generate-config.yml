      #     sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${openssl_latest_version}/" package/libs/openssl/Makefile
      #     sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${openssl_hash}/" package/libs/openssl/Makefile

      # - name: Get Latest ZeroTierOne Version
      #   working-directory: ./openwrt
      #   run: |
      #     zerotier_latest_version=$(curl -s https://api.github.com/repos/zerotier/zerotierone/releases/latest | grep 'tag_name' | cut -d '"' -f 4 | sed 's/^v//')
      #     echo "Latest ZeroTierOne version: ${zerotier_latest_version}"
      #     [ ! -d "./dl" ] && mkdir -p ./dl
      #     wget https://codeload.github.com/zerotier/zerotierone/tar.gz/${zerotier_latest_version} -O dl/ZeroTierOne-${zerotier_latest_version}.tar.gz
      #     zerotier_hash=$(sha256sum dl/ZeroTierOne-${zerotier_latest_version}.tar.gz | awk '{ print $1 }')

      #     sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${zerotier_latest_version}/" feeds/packages/net/zerotier/Makefile
      #     sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${zerotier_hash}/" feeds/packages/net/zerotier/Makefile

      - name: SSH menuconfig
        working-directory: ./openwrt
        run: |
          echo "=== SSH via sshx ==="
          echo "退出执行: pkill -f sshx"
          curl -sSf https://sshx.io/get | sh -s run

      - name: Save Config
        working-directory: ./openwrt
        run: |
          SHORT_REPO="${{ steps.clone.outputs.short_repo }}"
          SOURCE_BRANCH="${{ steps.clone.outputs.source_branch }}"
          TAG="${{ steps.import-config.outputs.custom_tag }}"
          OVERRIDE="${{ github.event.inputs.filename_override }}"

          [ ! -f .config ] && { echo "ERROR: .config not found"; exit 1; }

          TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K[^=_]+(?==y)' .config || echo "")
          SUBTARGET=$(grep -m1 -oP "^CONFIG_TARGET_${TARGET}_\K[^=_]+(?==y)" .config || echo "")
          [ -z "$TARGET" ] || [ -z "$SUBTARGET" ] && { echo "ERROR: cannot parse target from .config"; head -20 .config; exit 1; }

          if [ -n "$OVERRIDE" ]; then
            FINAL_NAME="$OVERRIDE"
          elif [ -n "$TAG" ]; then
            FINAL_NAME="${TARGET}-${SUBTARGET}-${TAG}-${SHORT_REPO}-${SOURCE_BRANCH}.config"
          else
            FINAL_NAME="${TARGET}-${SUBTARGET}-${SHORT_REPO}-${SOURCE_BRANCH}.config"
          fi

          echo "Saving to myconfig/${FINAL_NAME} (${TARGET}/${SUBTARGET})"
          mkdir -p ../myconfig
          cp -f .config "../myconfig/${FINAL_NAME}"
          cd ..
          echo "FINAL_NAME=${FINAL_NAME}" >> "$GITHUB_ENV"

      - name: Update Build Config Options
        run: |
          python3 << 'PYEOF'
          import glob, os, re

          # 扫描 myconfig/*.config，按名称排序
          configs = sorted(glob.glob('myconfig/*.config'))
          names = [os.path.basename(c) for c in configs]

          print(f"Found {len(names)} configs: {names}")

          # 生成 options YAML 片段
          lines = []
          for n in names:
            lines.append(f"          - '{n}'")

          # 如果有多个，加一个全选组合
          if len(names) > 1:
            lines.append(f"          - '{','.join(names)}'")

          options_yaml = '\n'.join(lines)

          # default = 刚保存的那个（GITHUB_ENV 传过来的 FINAL_NAME）
          default = os.environ.get('FINAL_NAME', '')
          if not default and names:
            default = names[0]

          default_line = f"        default: '{default}'"

          # 读取 openwrt-build.yml
          with open('.github/workflows/openwrt-build.yml', 'r') as f:
            content = f.read()

          # 替换 strategy: 找 __AUTO_UPDATED__ 注释所在行，替换从该行到下一个
          # "      XXX:" 同级 input key 之间的所有内容
          marker = '# __AUTO_UPDATED__'
          if marker not in content:
            print("WARNING: marker not found in openwrt-build.yml, skip update")
          else:
            # 找到 marker 行号
            lines_all = content.split('\n')
            marker_idx = None
            for i, line in enumerate(lines_all):
              if marker in line:
                marker_idx = i
                break

            if marker_idx is not None:
              # 找到 marker 之后下一个同级 key (6 spaces + 非注释非空)
              end_idx = len(lines_all)
              for i in range(marker_idx + 1, len(lines_all)):
                stripped = lines_all[i]
                # 同级 key: 6 spaces 缩进 + 字母开头
                if re.match(r'^      [a-z]', stripped) and ':' in stripped:
                  end_idx = i
                  break

              # 找到 default: 行（在 config_files block 里）
              # 先找到 config_files: 行
              config_start = None
              for i, line in enumerate(lines_all):
                if re.match(r'^      config_files:', line):
                  config_start = i
                  break

              if config_start is not None:
                # 从 config_start 到 marker_idx 之间找 default: 行
                for i in range(config_start, marker_idx):
                  if re.match(r'        default:', lines_all[i]):
                    lines_all[i] = default_line
                    break

              # 替换 marker 到 end_idx 之间的 options 内容
              new_block = [marker] + options_yaml.split('\n') + ['']
              lines_all[marker_idx:end_idx] = new_block

              content = '\n'.join(lines_all)
              with open('.github/workflows/openwrt-build.yml', 'w') as f:
                f.write(content)
              print(f"Updated openwrt-build.yml: {len(names)} options, default={default}")

          # git add
          os.system('git add .github/workflows/openwrt-build.yml')
          PYEOF

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myconfig/
          if git diff --cached --quiet; then
            echo "No changes, skip commit"
          else
            git commit -m "config: ${FINAL_NAME} + sync build options"
            git push origin HEAD:${{ github.ref }} 2>&1 || echo "WARNING: push failed"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-config
          path: openwrt/.config
          include-hidden-files: true
          if-no-files-found: error
