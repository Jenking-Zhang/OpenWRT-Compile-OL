      #     sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${zerotier_hash}/" feeds/packages/net/zerotier/Makefile


      - name: Set Kernel Version
        if: github.event.inputs.set_kernel_version == 'true'
        working-directory: ./openwrt
        run: |
          KVER="${{ github.event.inputs.kernel_version }}"
          if [ -d "./target/linux/x86/patches-${KVER}" ]; then
            TARGET_DIR="./target/linux/x86"
          elif [ -d "./target/linux/qualcommax/patches-${KVER}" ]; then
            TARGET_DIR="./target/linux/qualcommax"
          elif [ -d "./target/linux/ramips/patches-${KVER}" ]; then
            TARGET_DIR="./target/linux/ramips"
          elif [ -d "./target/linux/ath79/patches-${KVER}" ]; then
            TARGET_DIR="./target/linux/ath79"
          else
            TARGET_DIR=$(find ./target/linux -maxdepth 1 -type d -name "patches-${KVER}" | head -1 | xargs dirname 2>/dev/null || echo "")
          fi
          if [ -n "$TARGET_DIR" ] && [ -f "$TARGET_DIR/Makefile" ]; then
            sed -i 's/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:='${KVER}'/g' "$TARGET_DIR/Makefile"
            sed -i 's/^KERNEL_TESTING_PATCHVER:=.*/KERNEL_TESTING_PATCHVER:='${KVER}'/g' "$TARGET_DIR/Makefile"
            echo "Set kernel to ${KVER} in ${TARGET_DIR}"
          else
            echo "::warning::Kernel patches-${KVER} not found, skipping."
          fi

      - name: Custom Settings
        working-directory: ./openwrt
        run: |
          if [ "${{ github.event.inputs.set_lan_ip }}" = "true" ]; then
            for f in package/base-files/files/bin/config_generate package/base-files/luci2/bin/config_generate feeds/luci/modules/luci-mod-system/htdocs/luci-static/luci/flash.js; do
              [ -f "$f" ] && sed -i "s/192\.168\.[0-9]*\.[0-9]*/${{ github.event.inputs.lan_ip }}/g" "$f"
            done
          fi

          [ -f package/base-files/files/bin/config_generate ] && \
            sed -i "s/hostname='.*'/hostname='${{ github.event.inputs.hostname }}'/g" package/base-files/files/bin/config_generate

          [ -f scripts/projectsmirrors.json ] && \
            sed -i '/\.cn\//d; /tencent/d; /aliyun/d; /ustc/d; /huawei/d' scripts/projectsmirrors.json

      - name: Import Config & Update
        working-directory: ./openwrt
        run: |
          cp -f "../myconfig/${{ env.CONFIG_FILE }}" .config
          make defconfig

      - name: Launch SSH
        if: github.event.inputs.enable_ssh == 'true'
        working-directory: ./openwrt
        run: |
          echo "退出执行: pkill -f sshx"
          curl -sSf https://sshx.io/get | sh -s run

      - name: Restore Tools Cache
        id: tools-restore
        continue-on-error: true
        if: github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.tools_restore_key }}
          path: openwrt/staging_dir/host*

      - name: Restore Toolchain Cache
        id: tc-restore
        continue-on-error: true
        if: github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.tc_restore_key }}
          path: |
            openwrt/.ccache
            openwrt/staging_dir/tool*

      - name: Touch Cache Stamps
        if: success() && github.event.inputs.enable_ccache != 'false'
        working-directory: ./openwrt
        run: |
          # 缓存里的 stamp 是昨天的时间戳，而 git clone 的源码 mtime 是刚刚
          # OpenWrt 按时间戳判断依赖，会让 Compile 阶段重编 tools/toolchain
          echo "Touching restored stamps..."
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          touch staging_dir/host/stamp/.tools_compile staging_dir/host/stamp/.tools_install 2>/dev/null || true
          for d in staging_dir/toolchain-*/stamp; do
            [ -d "$d" ] && touch "$d"/.toolchain_compile "$d"/.toolchain_install 2>/dev/null || true
          done
          echo "stamps touched:"
          ls -la staging_dir/host/stamp/ staging_dir/toolchain-*/stamp/ 2>/dev/null | head -20

      - name: Build Tools
        if: success() && steps.tools-restore.outputs.cache-hit != 'true'
        working-directory: ./openwrt
        run: |
          echo "Tools cache hit='${{ steps.tools-restore.outputs.cache-hit }}' (empty = 缓存关闭或未命中) -> 编译 tools"
          mkdir -p tmp && echo "1" > tmp/.build
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          make tools/compile -j$(nproc) || make -C tools compile -j$(nproc)
          make tools/install || make -C tools install
          du -sh staging_dir/host* 2>/dev/null || true

      - name: Save Tools Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/save@main
        with:
          key: ${{ steps.cache-keys.outputs.tools_save_key }}
          path: openwrt/staging_dir/host*

      - name: Prune Tools Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%s)
          P="${{ steps.cache-keys.outputs.tools_prefix }}"
          echo "--- ${P}: 同前缀保留最新一版，其他前缀超过 30 天的删除 ---"
          JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-tools-&per_page=100")
          echo "$JSON" | jq -r --arg p "${P}-" --argjson cutoff "$CUTOFF" '
            .actions_caches as $all
            | ($all | map(select(.key | startswith($p))) | sort_by(.created_at) | reverse) as $same
            | ($same[0].key // "") as $keep
            | $all[]
            | select(
                ((.key | startswith($p)) and (.key != $keep))
                or
                ((.key | startswith($p) | not) and ((.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff))
              )
            | "\(.id)\t\(.key)\t\(.created_at)"' \
            | while IFS=$'\t' read -r ID KEY CREATED; do
                [ -z "$ID" ] && continue
                echo "  DEL ${KEY} (${CREATED})"
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}" > /dev/null
              done
          echo "Tools prune done"

      - name: Build Toolchain
        if: success() && steps.tc-restore.outputs.cache-hit != 'true'
        working-directory: ./openwrt
        run: |
          echo "Toolchain cache hit='${{ steps.tc-restore.outputs.cache-hit }}' (empty = 缓存关闭或未命中) -> 编译 toolchain"
          mkdir -p tmp && echo "1" > tmp/.build
          find ./staging_dir -type d -name "stamp" -not -path "*target*" 2>/dev/null | \
              while read -r d; do find "$d" -type f -exec touch {} +; done
          make toolchain/compile -j$(nproc) || make -C toolchain compile -j$(nproc)
          make toolchain/install || make -C toolchain install
          du -sh staging_dir/tool* 2>/dev/null || true

      - name: Save Toolchain Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        uses: actions/cache/save@main
        with:
          key: ${{ steps.cache-keys.outputs.tc_save_key }}
          path: |
            openwrt/.ccache
            openwrt/staging_dir/tool*

      - name: Prune Toolchain Cache
        continue-on-error: true
        if: success() && github.event.inputs.enable_ccache != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -d '30 days ago' +%s)
          P="${{ steps.cache-keys.outputs.tc_prefix }}"
          echo "--- ${P}: 同前缀保留最新一版，其他前缀超过 30 天的删除 ---"
          JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-toolchain-&per_page=100")
          echo "$JSON" | jq -r --arg p "${P}-" --argjson cutoff "$CUTOFF" '
            .actions_caches as $all
            | ($all | map(select(.key | startswith($p))) | sort_by(.created_at) | reverse) as $same
            | ($same[0].key // "") as $keep
            | $all[]
            | select(
                ((.key | startswith($p)) and (.key != $keep))
                or
                ((.key | startswith($p) | not) and ((.created_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff))
              )
            | "\(.id)\t\(.key)\t\(.created_at)"' \
            | while IFS=$'\t' read -r ID KEY CREATED; do
                [ -z "$ID" ] && continue
                echo "  DEL ${KEY} (${CREATED})"
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}" > /dev/null
              done
          echo "Toolchain prune done"

      - name: Update DL Cache
        working-directory: ./openwrt
        run: |
          make download -j16

      - name: Save DL Cache
        continue-on-error: true
        if: success()
        uses: actions/cache/save@main
        with:
          key: ${{ steps.cache-keys.outputs.dl_save_key }}
          path: openwrt/dl

      - name: Prune DL Cache
        continue-on-error: true
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="${{ steps.cache-keys.outputs.dl_save_key }}"
          JSON=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-dl&per_page=100")

          # 新版确认存在后才清理旧版，避免上传失败/列表滞后导致误删
          if ! echo "$JSON" | jq -e --arg k "$KEEP" 'any(.actions_caches[]; .key == $k)' > /dev/null; then
            echo "New cache '${KEEP}' not visible yet, skip prune."
            exit 0
          fi

          echo "Keep: ${KEEP}"
          echo "$JSON" | jq -r --arg keep "$KEEP" \
            '.actions_caches[] | select(.key | startswith("wrt-dl")) | select(.key != $keep) | "\(.id)\t\(.key)\t\(.created_at)"' \
            | while IFS=$'\t' read -r ID KEY CREATED; do
                [ -z "$ID" ] && continue
                echo "  DEL ${KEY} (${CREATED})"
                curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches/${ID}" > /dev/null
              done
          echo "DL prune done"

      - name: Show DL Size
        working-directory: ./openwrt
        run: du -sh dl/

      - name: Report Cache Versions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Stored cache versions after update (wrt-*) ==="
          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=wrt-&per_page=100" \
            | jq -r '.actions_caches | sort_by(.key) | .[]
              | "  \(.key)  \(.size_in_bytes/1048576|floor)MB  created=\(.created_at)"'

      - name: Compile Firmware
        working-directory: ./openwrt
        run: |
          make -j$(nproc) || make -j1 V=s
          df -h
          echo "bin/:"
          du -h --max-depth=1 bin/ 2>/dev/null | head -20

      - name: Organize Artifacts
        id: organize
        working-directory: ./openwrt
        run: |
          mkdir -p upload

          tar -czf "upload/firmware-full-${{ matrix.config }}.tar.gz" -C bin . 2>/dev/null || true

          find ./bin/targets -type f \( -name "*.bin" -o -name "*.trx" -o -name "*.itb" \
              -o -name "*.img" -o -name "*.ubi" -o -name "*.ufs" -o -name "*.sdcard" \
              -o -name "*.rootfs" -o -name "*.sysupgrade" -o -name "*.factory" \
              -o -name "*.combined" -o -name "*.ext4" -o -name "*.squashfs" \
              -o -name "*.gz" -o -name "*.xz" -o -name "*.zip" \
              -o -name "*.bin.asc" -o -name "*.trx.asc" \) \
              -exec cp -f {} upload/ \; 2>/dev/null || true

          find ./bin/packages -type f -name "*.ipk" -exec cp -f {} upload/ \; 2>/dev/null || true

          find ./bin/targets -type f \( -name "*.buildinfo" -o -name "*.manifest" -o -name "*.sha256sums" \) \
              -exec cp -f {} upload/ \; 2>/dev/null || true

          ls -lh upload/ | tail -n +2
          echo "=== Manifest content ==="
          grep -oP '^kernel - \K[\d\.]+' upload/*.manifest 2>/dev/null | head -1 || true

          echo "KVER=$(grep -oP '^kernel - \K[\d\.]+' upload/*.manifest 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.config }}-${{ github.run_number }}
          path: openwrt/upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Delete Old Releases (same config)
        if: env.DO_RELEASE == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="firmware/${CONFIG_FILE}-"
          echo "Cleaning up old releases matching tag prefix: ${PREFIX}"

          OLD_TAGS=$(curl -sH "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" | \
            jq -r --arg p "$PREFIX" '.[] | select(.tag_name | startswith($p)) | .tag_name')

          if [ -z "$OLD_TAGS" ]; then
            echo "No old releases found."
            exit 0
          fi

          echo "Found old releases:"
          echo "$OLD_TAGS"

          for tag in $OLD_TAGS; do
            echo "  → Deleting: $tag"
            gh release delete "$tag" -y 2>&1 || echo "    WARNING: failed to delete $tag"
          done

      - name: Prepare Release Meta
        if: env.DO_RELEASE == 'true' && success()
        run: |
          echo "RELEASE_DATE=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_ENV"

      - name: Create Release
        if: env.DO_RELEASE == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware/${{ matrix.config }}-${{ github.run_number }}
          name: '${{ matrix.config }} | ${{ env.SOURCE_LABEL }} | Run #${{ github.run_number }}'
          files: openwrt/upload/*
          body: |
            **Config**: `${{ matrix.config }}`
            **Source**: `${{ env.REPO_URL }}`
            **Branch**: `${{ env.REPO_BRANCH }}`
            **Kernel**: `${{ steps.organize.outputs.KVER || 'unknown' }}`
            **Run**: #${{ github.run_number }}
            **Commit**: ${{ steps.clone.outputs.WRT_HASH }}
            **Date**: ${{ env.RELEASE_DATE }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

