name: OpenWRT-Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      config_files:
        description: '配置文件下拉（myconfig/）'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - 'qualcommax_ipq807x_linksys-homewrk_VIKINGYFY_owrt.config'
          - 'qualcommbe_ipq53xx_jdcloud-re-cs-06_coolsnowwolf_master.config'
          - 'qualcommbe_ipq53xx_jdcloud-re-cs-06_VIKINGYFY_owrt.config'
          - 'x86_64_generic_coolsnowwolf_master.config'
          - 'x86_64_generic_VIKINGYFY_owrt.config'

      config_extra:
        description: '自定义配置（逗号分隔多个；优先级高于下拉；留空=用下拉）'
        required: false
        default: 'qualcommbe_ipq53xx_jdcloud-re-cs-06_VIKINGYFY_owrt.config,qualcommax_ipq807x_linksys-homewrk_VIKINGYFY_owrt.config,x86_64_generic_VIKINGYFY_owrt.config'

      set_kernel_version:
        description: '切换内核主版本'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

      kernel_version:
        description: '自定义内核主版本（如 6.6）'
        required: false
        default: '6.6'

      update_kernel:
        description: '更新内核小版本至最新'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

      set_lan_ip:
        description: '修改LAN IP'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

      lan_ip:
        description: '自定义LAN IP'
        required: false
        default: '192.168.87.1'

      hostname:
        description: '自定义主机名'
        required: false
        default: 'OpenWrt'

      enable_ccache:
        description: '启用ccache缓存'
        required: true
        default: 'true'
        type: choice
        options: [true, false]

      do_cleanup:
        description: '清理系统环境'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

      enable_ssh:
        description: '开启SSH调试'
        required: true
        default: 'false'
        type: choice
        options: [true, false]

      do_release:
        description: '编译后创建Release'
        required: true
        default: 'true'
        type: choice
        options: [true, false]

  schedule:
    # 每周一 01:00（北京时间）/ 周日 17:00（UTC）自动编译
    - cron: '0 17 * * 0'

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_OWNER: ${{ github.repository_owner }}
  RUN_DATE: ${{ github.event.schedule && format('{0}', github.run_id) || github.run_id }}

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Matrix
        id: set-matrix
        run: |
          DROPDOWN="${{ github.event.inputs.config_files }}"
          EXTRA="${{ github.event.inputs.config_extra }}"

          # config_extra 优先（自定义 > 下拉）
          if [ -n "$EXTRA" ]; then
            CONFIG_INPUT="$EXTRA"
          else
            CONFIG_INPUT="$DROPDOWN"
          fi

          [ -z "$CONFIG_INPUT" ] && CONFIG_INPUT="qualcommbe_ipq53xx_jdcloud-re-cs-06_VIKINGYFY_owrt.config,qualcommax_ipq807x_linksys-homewrk_VIKINGYFY_owrt.config,x86_64_generic_VIKINGYFY_owrt.config"
          echo "Config source: config_extra='${EXTRA}' → using '${CONFIG_INPUT}'"

          IFS=',' read -ra CONFIGS <<< "$CONFIG_INPUT"
          JSON="["
          FIRST=1

          for cfg in "${CONFIGS[@]}"; do
            cfg="${cfg// /}"
            if [ -z "$cfg" ]; then continue; fi
            if [ $FIRST -eq 1 ]; then
              FIRST=0
            else
              JSON="${JSON},"
            fi
            JSON="${JSON}\"${cfg}\""
          done

          JSON="${JSON}]"

          echo "matrix={\"config\":${JSON}}" >> "$GITHUB_OUTPUT"
          echo "Matrix configs: $JSON"

  build:
    needs: prepare
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    env:
      CONFIG_FILE: ${{ matrix.config }}
      BUILD_DATE: ${{ github.run_number }}
      DO_RELEASE: ${{ github.event.inputs.do_release || 'true' }}

    steps:
      - name: Resolve Source From Filename
        id: resolve
        run: |
          # 文件名格式 (强制): TARGET_SUBTARGET[_TAG]_SHORT_REPO_BRANCH.config
          # 全下划线分隔, REPO/BRANCH 在最后两位, TAG 可选 (可含 hyphen)
          # 例: qualcommbe_ipq53xx_JDC-BE6500_VIKINGYFY_owrt.config
          STEM="${CONFIG_FILE%.config}"

          REPO_NAMES="VIKINGYFY JuliusBairaktaris coolsnowwolf immortalwrt openwrt LiBwrt"

          # BRANCH = 最后一段 (最后一个 _ 之后)
          BRANCH="${STEM##*_}"

          # 找 REPO: 后缀必须是 "_${repo}_${BRANCH}"
          MATCHED_REPO=""
          for repo in $REPO_NAMES; do
            if [[ "$STEM" == *"_${repo}_${BRANCH}" ]]; then
              MATCHED_REPO="$repo"
              break
            fi
          done

          [ -z "$MATCHED_REPO" ] && {
            echo "ERROR: cannot parse SHORT_REPO / BRANCH from '${CONFIG_FILE}'"
            echo "  Required format: TARGET_SUBTARGET[_TAG]_SHORT_REPO_BRANCH.config"
            echo "  Example: qualcommbe_ipq53xx_JDC-BE6500_VIKINGYFY_owrt.config"
            echo "  Known repos: $REPO_NAMES"
            exit 1
          }

          [ -z "$BRANCH" ] && {
            echo "ERROR: empty BRANCH in '${CONFIG_FILE}'"
            exit 1
          }

          case "$MATCHED_REPO" in
            "VIKINGYFY")         SOURCE_OWNER="VIKINGYFY/immortalwrt" ;;
            "coolsnowwolf")      SOURCE_OWNER="coolsnowwolf/lede" ;;
            "immortalwrt")       SOURCE_OWNER="immortalwrt/immortalwrt" ;;
            "openwrt")           SOURCE_OWNER="openwrt/openwrt" ;;
            "LiBwrt")            SOURCE_OWNER="LiBwrt/LibWrt" ;;
            "JuliusBairaktaris") SOURCE_OWNER="JuliusBairaktaris/openwrt-ppe-nss" ;;
            *)                   SOURCE_OWNER="${MATCHED_REPO}/openwrt" ;;
          esac

          echo "REPO_URL=https://github.com/${SOURCE_OWNER}" >> "$GITHUB_ENV"
          echo "REPO_BRANCH=${BRANCH}" >> "$GITHUB_ENV"
          echo "SOURCE_LABEL=${SOURCE_OWNER}" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=${BRANCH}" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "  Resolved from filename: ${CONFIG_FILE}"
          echo "  Repo   : ${SOURCE_OWNER}"
          echo "  Branch : ${BRANCH}"
          echo "=========================================="

      - name: Show Task Info
        run: |
          echo "=========================================="
          echo "  Repo   : ${{ env.REPO_URL }}"
          echo "  Branch : ${{ env.REPO_BRANCH }}"
          echo "  Config : ${{ env.CONFIG_FILE }}"
          echo "  Kernel : ${{ github.event.inputs.set_kernel_version || 'false' }} / ${{ github.event.inputs.kernel_version || '6.6' }}"
          echo "  LAN IP : ${{ github.event.inputs.set_lan_ip || 'false' }} / ${{ github.event.inputs.lan_ip || '192.168.87.1' }}"
          echo "  ccache : ${{ github.event.inputs.enable_ccache || 'true' }}"
          echo "  SSH    : ${{ github.event.inputs.enable_ssh || 'false' }}"
          echo "=========================================="

      - name: Show Server Info
        run: |
          echo "OS    : $(lsb_release -d | awk -F'\t' '{print $2}')"
          echo "Kernel: $(uname -r)"
          echo "CPU   : $(nproc) cores"
          echo "Mem   : $(free -h | grep Mem | awk '{print $2}')"
          df -hT /

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Config File
        run: |
          if [ ! -f "myconfig/${{ env.CONFIG_FILE }}" ]; then
            echo "::error::Config file myconfig/${{ env.CONFIG_FILE }} not found!"
            ls myconfig/
            exit 1
          fi

          echo "Config OK: myconfig/${{ env.CONFIG_FILE }}"

      - name: Init Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          START=$(date +%s)
          BEFORE_ROOT=$(df -k / | tail -1 | awk '{print $3}')

          if [ "${{ github.event.inputs.do_cleanup }}" = "true" ]; then

            docker image prune -a -f 2>/dev/null || true
            UNUSED_DIRS=(
              "/usr/local/lib/android"
              "/usr/share/dotnet"
              "/usr/share/swift"
              "/opt/hostedtoolcache"
              "/usr/share/miniconda"
              "/opt/microsoft"
              "/opt/az"
              "/opt/google/chrome"
              "/usr/lib/mono"
              "/usr/lib/firefox"
              "/home/linuxbrew"
            )
            for d in "${UNUSED_DIRS[@]}"; do
              [ -e "$d" ] && sudo rm -rf "$d" 2>/dev/null || true
            done


            for GRP in android* azure* dotnet* google-cloud* mono-* libmono-*; do
              dpkg -l "$GRP" 2>/dev/null | grep -q '^ii' && sudo apt-get purge -y "$GRP" 2>/dev/null || true
            done
            sudo apt-get autoremove -y 2>/dev/null || true
            sudo apt-get clean
          else
            echo "已跳过预装环境清理"
          fi

          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang cmake curl git wget sed grep jq ccache \
            device-tree-compiler gawk genisoimage libncurses5-dev \
            libc6-dev-i386 libncursesw5-dev zlib1g-dev libssl-dev \
            python3 python3-pyelftools rsync subversion unzip xz-utils vim \
            libgmp-dev libmpc-dev libmpfr-dev libelf-dev libdw-dev libbpf-dev \
            libreadline-dev libglib2.0-dev libfuse-dev libtool haveged \
            msmtp p7zip-full swig texinfo dos2unix patchelf fakeroot

          sudo timedatectl set-timezone "Asia/Shanghai"

          AFTER_ROOT=$(df -k / | tail -1 | awk '{print $3}')
          FREED=$(( (BEFORE_ROOT - AFTER_ROOT) / 1024 ))
          TOTAL=$(( $(date +%s) - START ))
          echo "--- DONE: 释放 ${FREED}MB ($(( FREED/1024 ))GB), 耗时 ${TOTAL}s ---"
          df -h /

      - name: Clone OpenWrt Source
        id: clone
        run: |
          git clone --depth=1 --single-branch --branch "${REPO_BRANCH}" \
              "${REPO_URL}" openwrt

          cd openwrt
          echo "WRT_HASH=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Source: ${REPO_URL} (${REPO_BRANCH})"
          echo "Hash: $(git rev-parse --short HEAD)"

      - name: Resolve Cache Keys
        id: cache-keys
        continue-on-error: true
        working-directory: ./openwrt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)

          TARGET=$(grep -m1 -oP '^CONFIG_TARGET_\K[^=_]+(?==y)' "../myconfig/${{ env.CONFIG_FILE }}" 2>/dev/null || echo "unknown")
          SUBTARGET=$(grep -m1 -oP "^CONFIG_TARGET_${TARGET}_\K[^=_]+(?==y)" "../myconfig/${{ env.CONFIG_FILE }}" 2>/dev/null || echo "unknown")
          TOOLS_HASH=$(git archive HEAD tools 2>/dev/null | sha256sum | cut -c1-7 || echo "unknown")
          TC_HASH=$(git archive HEAD tools toolchain 2>/dev/null | sha256sum | cut -c1-7 || echo "unknown")

          DL_SAVE_KEY="wrt-dl-${TS}"
          TOOLS_PREFIX="wrt-tools-${TOOLS_HASH}"
          TC_PREFIX="wrt-toolchain-${TARGET}-${SUBTARGET}-${TC_HASH}"
          TOOLS_SAVE_KEY="${TOOLS_PREFIX}-${TS}"
          TC_SAVE_KEY="${TC_PREFIX}-${TS}"

          api() {
            curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/caches?key=$1&per_page=100"
          }
          latest() {
            echo "$1" | jq -r --arg p "$2" '[.actions_caches[] | select(.key | startswith($p))] | sort_by(.created_at) | reverse | .[0].key // empty'
          }
          inventory() {
            echo "--- $1 ---"
            echo "$2" | jq -r '.actions_caches | sort_by(.created_at) | .[] | "  \(.key)  \(.size_in_bytes/1048576|floor)MB  created=\(.created_at)"'
          }

          DJ=$(api "wrt-dl")
          TJ=$(api "wrt-tools-")
          CJ=$(api "wrt-toolchain-")
          inventory "DL 现有版本" "$DJ"
          inventory "Tools 现有版本" "$TJ"
          inventory "Toolchain 现有版本" "$CJ"

          DL_RESTORE_KEY=$(latest "$DJ" "wrt-dl");    [ -z "$DL_RESTORE_KEY" ] && DL_RESTORE_KEY="wrt-dl"
          TOOLS_RESTORE_KEY=$(latest "$TJ" "${TOOLS_PREFIX}-"); [ -z "$TOOLS_RESTORE_KEY" ] && TOOLS_RESTORE_KEY="${TOOLS_PREFIX}"
          TC_RESTORE_KEY=$(latest "$CJ" "${TC_PREFIX}-");       [ -z "$TC_RESTORE_KEY" ] && TC_RESTORE_KEY="${TC_PREFIX}"

          echo "=== 本次使用的 key ==="
          echo "  DL        restore=${DL_RESTORE_KEY}  save=${DL_SAVE_KEY}"
          echo "  Tools     restore=${TOOLS_RESTORE_KEY}  save=${TOOLS_SAVE_KEY}"
          echo "  Toolchain restore=${TC_RESTORE_KEY}  save=${TC_SAVE_KEY}"

          for kv in \
            "dl_restore_key=${DL_RESTORE_KEY}" \
            "dl_save_key=${DL_SAVE_KEY}" \
            "tools_prefix=${TOOLS_PREFIX}" \
            "tc_prefix=${TC_PREFIX}" \
            "tools_restore_key=${TOOLS_RESTORE_KEY}" \
            "tc_restore_key=${TC_RESTORE_KEY}" \
            "tools_save_key=${TOOLS_SAVE_KEY}" \
            "tc_save_key=${TC_SAVE_KEY}"; do
            echo "$kv" >> "$GITHUB_OUTPUT"
          done

      - name: Restore DL Cache
        continue-on-error: true
        uses: actions/cache/restore@main
        with:
          key: ${{ steps.cache-keys.outputs.dl_restore_key }}
          path: openwrt/dl

      - name: Enable Feeds & Update
        working-directory: ./openwrt
        run: |
          sed -i 's/^#src-git helloworld/src-git helloworld/g' ./feeds.conf.default

          if ! grep -q "linkease/istore" ./feeds.conf.default 2>/dev/null; then
            echo 'src-git istore https://github.com/linkease/istore;main' >> feeds.conf.default
          fi

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Get Latest Tailscale Version
        working-directory: ./openwrt
        run: |
          tailscale_latest_version=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | grep 'tag_name' | cut -d '"' -f 4 | sed 's/^v//')
          echo "Latest Tailscale version: ${tailscale_latest_version}"
          [ ! -d "./dl" ] && mkdir -p ./dl
          TS_FILE="dl/tailscale-${tailscale_latest_version}.tar.gz"
          [ -f "${TS_FILE}" ] || wget https://codeload.github.com/tailscale/tailscale/tar.gz/v${tailscale_latest_version} -O "${TS_FILE}"
          tailscale_hash=$(sha256sum "${TS_FILE}" | awk '{ print $1 }')
          echo "Tailscale hash: ${tailscale_hash}"
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${tailscale_latest_version}/" feeds/packages/net/tailscale/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${tailscale_hash}/" feeds/packages/net/tailscale/Makefile

