      #     rm -rf /tmp/luci-app-tailscale-community

      #     # echo "=============================="
      #     # echo "Installed Tailscale package:"
      #     # echo "=============================="
      #     # cat ./feeds/packages/net/tailscale/Makefile || true

      #     echo "=============================="
      #     echo "Installed LuCI app:"
      #     echo "=============================="
